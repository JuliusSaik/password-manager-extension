<!doctype html>
<html lang="lt">
<head><meta charset="utf-8"><title>Demo Bankas – prisijungimas</title><link rel="stylesheet" href="style.css"></head>
<body>
  <form class="box" id="login" action="welcome.html">
    <h1>Demo Bankas</h1>
    <p>Testinis puslapis KeyVault plėtiniui išbandyti</p>
    <label for="email">El. paštas</label>
    <input id="email" name="email" type="email" autocomplete="username" placeholder="vardas@pavyzdys.lt">
    <label for="password">Slaptažodis</label>
    <input id="password" name="password" type="password" autocomplete="current-password" placeholder="••••••••">
    <button type="submit">Prisijungti</button>
  </form>
  <script>
    // Nesiunčiam slaptažodžio URL'e – tiesiog pereinam į "sveiki" puslapį
    document.getElementById('login').addEventListener('submit', (e) => {
      e.preventDefault();
      setTimeout(() => (location.href = 'welcome.html'), 150);
    });
  </script>
</body>
</html>
